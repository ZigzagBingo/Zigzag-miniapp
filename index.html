

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIGZAG Multiplayer Bingo</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #081426;
  color: white;
  font-family: Arial, sans-serif;
}
.container { max-width: 480px; margin: auto; }
h1 { color: #f5c542; }
.card {
  background: #14243b;
  padding: 20px;
  margin: 18px 0;
  border-radius: 15px;
}
button {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.gold { background: #f5c542; color: #081426; }
.dark { background: #243750; color: white; }
p { color: #bdc9d8; }
</style>
</head>
<body>
<div class="container">

<h1>🎯 ZIGZAG BINGO</h1>
<p>Multiplayer Bingo Experience</p>

<div class="card">
  <h2>Play. Compete. Enjoy!</h2>
  <p>Welcome to ZIGZAG Multiplayer Bingo.</p>
  <button class="gold"
    onclick="alert('Game selection coming soon!')">
    PLAY BINGO
  </button>
</div>

<div class="card">
  <h2>My Wallet</h2>
  <p>ETB Balance: 0.00</p>
  <p>USD Balance: 0.00</p>
  <button class="gold" onclick="location.href='wallet.html'">
    OPEN MY WALLET
  </button>
  <p>Demonstration balances only.</p>
</div>

<div class="card">
  <h3>Other Features</h3>
<button class="dark" onclick="location.href='profile.html'">My Profile</button> 
  <button class="dark" onclick="location.href='leaderboard.html'">Leaderboard</button>
  <button class="dark" onclick="location.href='history.html'">Game History</button>
  <button class="dark" onclick="location.href='help.html'">Help & Support</button>
</div>

<p style="text-align:center">ZIGZAG Multiplayer Bingo</p>

</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    async function connectTelegramPlayer() {
        try {
            const response = await fetch(
                "https://zigzag-miniapp-production.up.railway.app/api/me",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: tg.initData
                    })
                }
            );

            const result = await response.json();

            if (result.verified) {
                console.log("Verified Telegram player:", result.player);
            } else {
                console.log("Telegram verification failed");
            }
        } catch (error) {
            console.error("Connection error:", error);
        }
    }

    if (tg.initData) {
        connectTelegramPlayer();
    }
</script>
</body>
</html>
